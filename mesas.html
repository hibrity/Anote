<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Anote — Mesas</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";
window.supabase=createClient("https://mrchckrrkkvkmhpgellp.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yY2hja3Jya2t2a21ocGdlbGxwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1NDU4NTYsImV4cCI6MjA4OTEyMTg1Nn0.sIhnEkNV7614lZj3WKFFjSvyxLqVf0ReNu-ka88eUjk");
window.dispatchEvent(new Event("supabase-ready"));
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f172a;--card:#1e293b;--card2:#0b1220;--border:#2c3a52;--txt:#f1f5f9;--mut:#94a3b8;--green:#22c55e;--blue:#3b82f6;--amber:#f59e0b;--red:#ef4444;--r:14px}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.hidden{display:none!important}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px}
h2{font-size:17px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-green{background:var(--green);color:#052e16}
.btn-blue{background:var(--blue);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn-ghost{background:var(--card2);color:var(--txt);border:1px solid var(--border)}
.btn-sm{padding:6px 10px;font-size:12px}
input{width:100%;padding:10px 12px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--txt);font-size:14px;margin-bottom:8px;outline:none}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
.muted{color:var(--mut);font-size:13px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.title{font-size:20px;font-weight:800}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:14px}
.qr-item{background:#fff;border-radius:12px;padding:16px;text-align:center;border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:8px}
.qr-box{width:150px;height:150px;background:#fff;display:flex;align-items:center;justify-content:center;border-radius:8px;overflow:hidden}
.qr-box img,.qr-box canvas{display:block;max-width:100%;max-height:100%}
.qr-label{font-weight:800;color:#1c1917;font-size:16px;margin-top:4px}
.qr-link{font-size:9px;color:#94a3b8;word-break:break-all;max-width:180px;line-height:1.2}
.qr-actions{display:flex;gap:6px;justify-content:center;width:100%;margin-top:4px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:12px;font-size:14px;font-weight:700;z-index:9999;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(4px)}
.empty{text-align:center;padding:40px;color:var(--mut)}
.empty .big{font-size:48px;margin-bottom:12px}
.err-box{background:#451a1a;color:#fca5a5;border:1px solid #7f1d1d;border-radius:10px;padding:14px;margin-top:14px;font-size:13px;word-break:break-word}
@media print{
 body *{visibility:hidden}
 .print-area,.print-area *{visibility:visible}
 .print-area{position:absolute;left:0;top:0;width:100%}
 .no-print{display:none!important}
}
</style>
</head>
<body>
<div class="wrap">
<div class="topbar no-print">
 <div>
  <div class="title">🔳 Mesas</div>
  <div class="muted" id="store_label">Carregando...</div>
 </div>
 <button class="btn btn-ghost" onclick="location.href='index.html'">🏠 Painel</button>
</div>

<div class="card no-print">
 <h2>➕ Nova mesa</h2>
 <div class="row">
  <input id="qr_mesa_num" placeholder="Número ou nome da mesa (ex: 5, VIP)" style="margin-bottom:0"/>
  <button class="btn btn-green" id="btn_create_mesa" onclick="createMesa()" style="flex:none;padding:10px 20px">➕ Gerar QR</button>
 </div>
</div>

<div class="card no-print">
 <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
  <button class="btn btn-ghost btn-sm" onclick="reloadMesas()">🔄 Atualizar</button>
  <button class="btn btn-blue btn-sm" onclick="window.print()">🖨️ Imprimir tudo</button>
  <span class="muted" style="margin-left:auto" id="mesa_count">— mesas</span>
 </div>
</div>

<div class="print-area">
 <div id="qr_container"><div class="empty"><div class="big">⏳</div>Carregando mesas...</div></div>
</div>
</div>

<div id="toast" class="toast"></div>

<script>
const $=id=>document.getElementById(id);
let S={store:null,code:null},tables=[];

function toast(m,t='ok'){
 const e=$('toast');e.textContent=m;
 e.style.background=t==='err'?'#ef4444':'#22c55e';
 e.style.color=t==='err'?'#fff':'#052e16';
 e.classList.add('show');
 clearTimeout(e._tm);e._tm=setTimeout(()=>e.classList.remove('show'),2500);
}
function waitSB(){return new Promise((res,rej)=>{if(window.supabase)return res();const t=setTimeout(()=>rej(),10000);window.addEventListener('supabase-ready',()=>{clearTimeout(t);res()},{once:true})})}
async function rpc(n,p={}){try{const{data,error}=await supabase.rpc(n,p);if(error)console.warn(n+':',error.message);return{data,error}}catch(e){console.warn(n+' exception:',e);return{data:null,error:e}}}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

/* ===== QR COM FALLBACK ===== */
function qrImgUrl(link,size){return 'https://api.qrserver.com/v1/create-qr-code/?size='+size+'x'+size+'&data='+encodeURIComponent(link)}
function qrImgUrl2(link,size){return 'https://chart.googleapis.com/chart?cht=qr&chs='+size+'x'+size+'&chl='+encodeURIComponent(link)}
function useImgFallback(el,link,size){
 el.innerHTML='';
 const img=document.createElement('img');
 img.width=size;img.height=size;
 img.alt='QR Code';
 img.onerror=function(){
  if(this.src.indexOf('qrserver')!==-1){this.src=qrImgUrl2(link,size)}
  else{this.outerHTML='<div style="font-size:10px;color:#c00;padding:8px">QR indisponível</div>'}
 };
 img.src=qrImgUrl(link,size);
 el.appendChild(img);
}
function drawQR(el,link,size){
 size=size||150;el.innerHTML='';
 if(window.QRCode&&QRCode.toCanvas){
  const cv=document.createElement('canvas');el.appendChild(cv);
  try{QRCode.toCanvas(cv,link,{width:size,margin:2},function(err){if(err)useImgFallback(el,link,size)})}
  catch(e){useImgFallback(el,link,size)}
 }else useImgFallback(el,link,size);
}

/* ===== CARREGAR MESAS (função dedicada + erro visível) ===== */
async function reloadMesas(){
 $('qr_container').innerHTML='<div class="empty"><div class="big">⏳</div>Carregando mesas...</div>';
 const{data,error}=await rpc('dono_mesas',{p_store_id:S.store.id});
 if(error||!data||!data.ok){
  const msg=(error&&error.message)||(data&&data.error)||'Erro desconhecido ao listar mesas';
  $('mesa_count').textContent='erro';
  $('qr_container').innerHTML='<div class="err-box">⚠️ <b>'+escapeHtml(msg)+'</b><br>Loja: '+escapeHtml(S.store.id)+'<br>Verifique se a função <b>dono_mesas</b> foi criada no Supabase.</div>';
  return;
 }
 tables=data.tables||[];
 renderMesasQR();
}

/* ===== CRIAR MESA ===== */
async function createMesa(){
 const n=$('qr_mesa_num').value.trim();
 if(!n){toast('Digite o número da mesa','err');return}
 const btn=$('btn_create_mesa');
 btn.disabled=true;btn.textContent='Criando...';
 const{data,error}=await rpc('dono_criar_mesa',{p_store_id:S.store.id,p_numero:n});
 btn.disabled=false;btn.textContent='➕ Gerar QR';
 if(data?.ok){$('qr_mesa_num').value='';toast('Mesa criada! ✅');await reloadMesas()}
 else toast((error&&error.message)||(data&&data.error)||'Erro ao criar mesa','err');
}

/* ===== RENDER ===== */
function renderMesasQR(){
 const c=$('qr_container');
 c.innerHTML='';
 $('mesa_count').textContent=tables.length+' mesa'+(tables.length!==1?'s':'');
 if(!tables.length){
  c.innerHTML='<div class="empty"><div class="big">🔳</div>Nenhuma mesa cadastrada ainda.<br>Crie a primeira no formulário acima! 👆</div>';
  return;
 }
 const base=location.href.substring(0,location.href.lastIndexOf('/')+1);
 const grid=document.createElement('div');grid.className='qr-grid';
 tables.forEach(t=>{
  const link=base+'cliente.html?loja='+S.store.id+'&mesa='+t.id;
  const item=document.createElement('div');item.className='qr-item';
  item.innerHTML='<div class="qr-box" id="qrbox_'+t.id+'"></div>'
   +'<div class="qr-label">'+escapeHtml('Mesa '+t.table_number)+'</div>'
   +'<div class="qr-link">'+escapeHtml(link)+'</div>'
   +'<div class="qr-actions no-print">'
   +'<button class="btn btn-blue btn-sm" onclick="editMesa(\''+t.id+'\')">✏️ Editar</button>'
   +'<button class="btn btn-red btn-sm" onclick="delMesa(\''+t.id+'\')">🗑️ Excluir</button>'
   +'</div>';
  grid.appendChild(item);
 });
 c.appendChild(grid);
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  tables.forEach(t=>{
   const link=base+'cliente.html?loja='+S.store.id+'&mesa='+t.id;
   const box=document.getElementById('qrbox_'+t.id);
   if(box)drawQR(box,link,150);
  });
 }));
}

/* ===== EDITAR / EXCLUIR ===== */
async function editMesa(id){
 const t=tables.find(x=>x.id===id);if(!t)return;
 const novo=prompt('Novo número/nome da mesa:',t.table_number);
 if(!novo||!novo.trim())return;
 const{data,error}=await rpc('dono_atualizar_mesa',{p_store_id:S.store.id,p_table_id:id,p_numero:novo.trim()});
 if(data?.ok){toast('Mesa atualizada! ✅');await reloadMesas()}
 else toast((error&&error.message)||(data&&data.error)||'Erro','err');
}
async function delMesa(id){
 if(!confirm('Excluir esta mesa e o QR Code?'))return;
 const{data,error}=await rpc('dono_excluir_mesa',{p_store_id:S.store.id,p_table_id:id});
 if(data?.ok){toast('Mesa excluída! 🗑️');await reloadMesas()}
 else toast((error&&error.message)||(data&&data.error)||'Erro','err');
}

/* ===== BOOT ===== */
async function boot(){
 try{await waitSB()}catch(e){location.href='index.html';return}
 const{data:ses}=await supabase.auth.getSession();
 if(!ses.session){location.href='index.html';return}
 const{data}=await rpc('dono_entrar');
 if(!data?.ok||!data.store){location.href='index.html';return}
 S.store=data.store;S.code=data.store.staff_code||null;
 $('store_label').textContent='🏪 '+S.store.name+' — Gerencie os QR Codes das mesas';
 await reloadMesas();
}
boot();
window.createMesa=createMesa;window.reloadMesas=reloadMesas;window.editMesa=editMesa;window.delMesa=delMesa;
</script>
</body>
</html>
