<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Anote — Catálogo</title>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";
window.supabase=createClient("https://mrchckrrkkvkmhpgellp.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yY2hja3Jya2t2a21ocGdlbGxwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1NDU4NTYsImV4cCI6MjA4OTEyMTg1Nn0.sIhnEkNV7614lZj3WKFFjSvyxLqVf0ReNu-ka88eUjk");
window.dispatchEvent(new Event("supabase-ready"));
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f172a;--card:#1e293b;--card2:#0b1220;--border:#2c3a52;--txt:#f1f5f9;--mut:#94a3b8;--green:#22c55e;--blue:#3b82f6;--red:#ef4444;--amber:#f59e0b;--r:14px}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt)}
.wrap{max-width:1100px;margin:0 auto;padding:16px}.hidden{display:none!important}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px}
h2{font-size:17px;margin-bottom:12px}h3{font-size:14px;margin-bottom:8px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer}
.btn-green{background:var(--green);color:#052e16}.btn-blue{background:var(--blue);color:#fff}.btn-red{background:var(--red);color:#fff}.btn-ghost{background:var(--card2);color:var(--txt);border:1px solid var(--border)}.btn-block{width:100%}.btn-sm{padding:6px 10px;font-size:12px}
input,select,textarea{width:100%;padding:10px 12px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--txt);font-size:14px;margin-bottom:8px;outline:none;font-family:inherit}
textarea{min-height:70px;resize:vertical}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
.muted{color:var(--mut);font-size:13px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.title{font-size:20px;font-weight:800}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{padding:10px 16px;border-radius:10px;background:var(--card2);border:1px solid var(--border);color:var(--mut);cursor:pointer;font-weight:700;font-size:14px}
.tab.active{background:var(--green);color:#052e16}
.item{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;gap:12px;align-items:center}
.item-img{width:56px;height:56px;border-radius:10px;background:var(--card);object-fit:cover;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px}
.item-body{flex:1;min-width:0}
.item-title{font-weight:700;font-size:14px;margin-bottom:2px}
.item-desc{font-size:12px;color:var(--mut)}
.item-meta{font-size:12px;color:var(--amber);font-weight:700;margin-top:2px}
.item-actions{display:flex;gap:6px;flex-shrink:0}
.msg{padding:10px;border-radius:10px;font-size:13px;margin-top:8px}
.msg.err{background:#451a1a;color:#fca5a5}.msg.ok{background:#14351f;color:#86efac}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
.badge-ok{background:#14351f;color:#86efac}.badge-off{background:#451a1a;color:#fca5a5}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:12px;font-size:14px;font-weight:700;z-index:9999;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(4px)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto}
.img-preview{width:100%;max-height:180px;object-fit:contain;border-radius:10px;background:var(--card2);margin-bottom:8px;border:1px solid var(--border)}
.empty{text-align:center;padding:30px;color:var(--mut)}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px}
.switch input{width:auto;margin:0}
</style>
</head>
<body>
<div class="wrap">
<div class="topbar">
 <div><div class="title" id="app_store_name">Catálogo</div><div class="muted">📦 Categorias e produtos</div></div>
 <button class="btn btn-ghost" onclick="location.href='index.html'">🏠 Painel</button>
</div>

<div class="tabs">
 <div class="tab active" id="tb_prod" onclick="switchTab('prod')">🍽️ Produtos</div>
 <div class="tab" id="tb_cat" onclick="switchTab('cat')">🏷️ Categorias</div>
</div>

<!-- ABA PRODUTOS -->
<div id="tab_prod">
 <div class="card">
  <div class="row">
   <input id="prod_search" placeholder="🔍 Buscar produto..." oninput="renderProd()" style="margin-bottom:0"/>
   <button class="btn btn-green" onclick="openProdModal()">➕ Novo produto</button>
  </div>
 </div>
 <div id="prod_list"></div>
</div>

<!-- ABA CATEGORIAS -->
<div id="tab_cat" class="hidden">
 <div class="card">
  <div class="row">
   <input id="cat_name" placeholder="Nome da nova categoria" style="margin-bottom:0"/>
   <button class="btn btn-green" onclick="createCat()">➕ Criar categoria</button>
  </div>
 </div>
 <div id="cat_list"></div>
</div>
</div>

<!-- MODAL PRODUTO -->
<div id="prod_modal" class="modal-bg hidden">
 <div class="modal">
  <h2 id="prod_modal_title">Novo produto</h2>
  <label>Nome</label><input id="p_name"/>
  <label>Descrição</label><textarea id="p_desc"></textarea>
  <label>Categoria</label><select id="p_cat"></select>
  <div class="row">
   <div><label>Preço (R$)</label><input id="p_price" type="number" step="0.01" min="0"/></div>
   <div><label>Ordem</label><input id="p_order" type="number" min="0"/></div>
  </div>
  <label>Imagem do produto</label>
  <img id="p_preview" class="img-preview hidden"/>
  <input id="p_img" type="file" accept="image/*" onchange="previewImg()"/>
  <div class="switch"><input type="checkbox" id="p_active" checked/><label for="p_active" style="margin:0">Disponível no cardápio</label></div>
  <div class="row" style="margin-top:8px">
   <button class="btn btn-green" onclick="saveProd()">💾 Salvar</button>
   <button class="btn btn-ghost" onclick="closeProdModal()">Cancelar</button>
  </div>
 </div>
</div>

<!-- MODAL CATEGORIA -->
<div id="cat_modal" class="modal-bg hidden">
 <div class="modal">
  <h2>Editar categoria</h2>
  <label>Nome</label><input id="c_edit_name"/>
  <div class="row" style="margin-top:8px">
   <button class="btn btn-green" onclick="saveCat()">💾 Salvar</button>
   <button class="btn btn-ghost" onclick="closeCatModal()">Cancelar</button>
  </div>
 </div>
</div>

<div id="toast" class="toast"></div>

<script>
const $=id=>document.getElementById(id);
let S={store:null,code:null},Cats=[],Prods=[],editProdId=null,editCatId=null,imgDataUrl=null;
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

function toast(m,t='ok'){const e=$('toast');e.textContent=m;e.style.background=t==='err'?'#ef4444':'#22c55e';e.style.color=t==='err'?'#fff':'#052e16';e.classList.add('show');clearTimeout(e._tm);e._tm=setTimeout(()=>e.classList.remove('show'),2500)}
function waitSB(){return new Promise((res,rej)=>{if(window.supabase)return res();const t=setTimeout(()=>rej(),10000);window.addEventListener('supabase-ready',()=>{clearTimeout(t);res()},{once:true})})}
async function rpc(n,p={}){try{const{data,error}=await supabase.rpc(n,p);if(error)console.warn(n+':',error.message);return{data,error}}catch(e){return{data:null,error:e}}}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function switchTab(t){
 ['prod','cat'].forEach(x=>{
  $('tab_'+x).classList.toggle('hidden',x!==t);
  $('tb_'+x).classList.toggle('active',x===t);
 });
}

/* ========== CATEGORIAS ========== */
async function loadCats(){
 const{data}=await rpc('catalogo_categorias',{p_store_id:S.store.id});
 if(data?.ok){Cats=data.categories||[];renderCat();populateCatSelect()}
}
async function createCat(){
 const n=$('cat_name').value.trim();
 if(!n){toast('Digite o nome da categoria','err');return}
 const{data}=await rpc('catalogo_criar_categoria',{p_store_id:S.store.id,p_nome:n});
 if(data?.ok){$('cat_name').value='';toast('Categoria criada! ✅');loadCats()}
 else toast(data?.error||'Erro ao criar','err');
}
function renderCat(){
 const el=$('cat_list');
 if(!Cats.length){el.innerHTML='<div class="empty">Nenhuma categoria ainda. Crie a primeira acima! 🏷️</div>';return}
 el.innerHTML=Cats.map(c=>{
  const qtd=Prods.filter(p=>p.category_id===c.id).length;
  return `<div class="item">
   <div style="font-size:24px">🏷️</div>
   <div class="item-body">
    <div class="item-title">${escapeHtml(c.name)}</div>
    <div class="item-desc">${qtd} produto(s)</div>
   </div>
   <div class="item-actions">
    <button class="btn btn-blue btn-sm" onclick="openCatModal('${c.id}','${escapeHtml(c.name).replace(/'/g,"\\'")}')">✏️</button>
    <button class="btn btn-red btn-sm" onclick="delCat('${c.id}')">🗑️</button>
   </div>
  </div>`;
 }).join('');
}
function populateCatSelect(){
 const sel=$('p_cat');
 if(!sel)return;
 sel.innerHTML='<option value="">— Sem categoria —</option>'+Cats.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
}
function openCatModal(id,name){editCatId=id;$('c_edit_name').value=name;$('cat_modal').classList.remove('hidden')}
function closeCatModal(){$('cat_modal').classList.add('hidden');editCatId=null}
async function saveCat(){
 const n=$('c_edit_name').value.trim();
 if(!n){toast('Nome vazio','err');return}
 const{data}=await rpc('catalogo_atualizar_categoria',{p_store_id:S.store.id,p_categoria_id:editCatId,p_nome:n});
 if(data?.ok){toast('Categoria salva! ✅');closeCatModal();loadCats()}
 else toast(data?.error||'Erro','err');
}
async function delCat(id){
 if(!confirm('Excluir esta categoria? Os produtos vinculados ficarão sem categoria.'))return;
 const{data}=await rpc('catalogo_excluir_categoria',{p_store_id:S.store.id,p_categoria_id:id});
 if(data?.ok){toast('Categoria excluída! 🗑️');loadAll()}
 else toast(data?.error||'Erro','err');
}

/* ========== PRODUTOS ========== */
async function loadProd(){
 const{data}=await rpc('catalogo_produtos',{p_store_id:S.store.id});
 if(data?.ok){Prods=data.products||[];renderProd()}
}
function renderProd(){
 const q=($('prod_search')?.value||'').toLowerCase().trim();
 const el=$('prod_list');
 const list=Prods.filter(p=>!q||p.name.toLowerCase().includes(q));
 if(!list.length){el.innerHTML='<div class="empty">Nenhum produto encontrado. Clique em "Novo produto"! 🍽️</div>';return}
 el.innerHTML=list.map(p=>{
  const cat=Cats.find(c=>c.id===p.category_id);
  const img=p.image_url?`<img class="item-img" src="${p.image_url}"/>`:'<div class="item-img">🍽️</div>';
  return `<div class="item">
   ${img}
   <div class="item-body">
    <div class="item-title">${escapeHtml(p.name)} <span class="badge ${p.is_active?'badge-ok':'badge-off'}">${p.is_active?'Disponível':'Indisponível'}</span></div>
    <div class="item-desc">${escapeHtml(p.description||'')}${cat?' • '+escapeHtml(cat.name):''}</div>
    <div class="item-meta">${money(p.price)}</div>
   </div>
   <div class="item-actions">
    <button class="btn btn-blue btn-sm" onclick='openProdModal(${JSON.stringify(p).replace(/'/g,"&#39;")})'>✏️</button>
    <button class="btn btn-red btn-sm" onclick="delProd('${p.id}')">🗑️</button>
   </div>
  </div>`;
 }).join('');
}
function openProdModal(p=null){
 editProdId=p?.id||null;
 $('prod_modal_title').textContent=p?'Editar produto':'Novo produto';
 $('p_name').value=p?.name||'';
 $('p_desc').value=p?.description||'';
 $('p_price').value=p?.price||'';
 $('p_order').value=p?.sort_order||0;
 $('p_active').checked=p?.is_active!==false;
 populateCatSelect();
 $('p_cat').value=p?.category_id||'';
 imgDataUrl=p?.image_url||null;
 if(imgDataUrl){$('p_preview').src=imgDataUrl;$('p_preview').classList.remove('hidden')}
 else $('p_preview').classList.add('hidden');
 $('p_img').value='';
 $('prod_modal').classList.remove('hidden');
}
function closeProdModal(){$('prod_modal').classList.add('hidden');editProdId=null;imgDataUrl=null}
function previewImg(){
 const f=$('p_img').files[0];
 if(!f)return;
 const r=new FileReader();
 r.onload=e=>{imgDataUrl=e.target.result;$('p_preview').src=imgDataUrl;$('p_preview').classList.remove('hidden')};
 r.readAsDataURL(f);
}
async function saveProd(){
 const nome=$('p_name').value.trim();
 if(!nome){toast('Nome obrigatório','err');return}
 const payload={
  p_store_id:S.store.id,
  p_nome:nome,
  p_descricao:$('p_desc').value.trim(),
  p_categoria_id:$('p_cat').value||null,
  p_preco:parseFloat($('p_price').value)||0,
  p_ordem:parseInt($('p_order').value)||0,
  p_ativo:$('p_active').checked,
  p_imagem:imgDataUrl
 };
 if(editProdId)payload.p_produto_id=editProdId;
 toast('Salvando...','ok');
 const{data}=await rpc(editProdId?'catalogo_atualizar_produto':'catalogo_criar_produto',payload);
 if(data?.ok){toast('Produto salvo! ✅');closeProdModal();loadAll()}
 else toast(data?.error||'Erro ao salvar','err');
}
async function delProd(id){
 if(!confirm('Excluir este produto?'))return;
 const{data}=await rpc('catalogo_excluir_produto',{p_store_id:S.store.id,p_produto_id:id});
 if(data?.ok){toast('Produto excluído! 🗑️');loadAll()}
 else toast(data?.error||'Erro','err');
}

async function loadAll(){await Promise.all([loadCats(),loadProd()])}

async function boot(){
 try{await waitSB()}catch(e){location.href='index.html';return}
 const{data:ses}=await supabase.auth.getSession();
 if(!ses.session){location.href='index.html';return}
 const{data}=await rpc('dono_entrar');
 if(!data?.ok||!data.store){location.href='index.html';return}
 S.store=data.store;
 if(!S.store.staff_code){const r=await rpc('dono_regenerar_codigo',{p_store_id:S.store.id});if(r.data?.ok)S.store.staff_code=r.data.staff_code;else{location.href='index.html';return}}
 S.code=S.store.staff_code;
 $('app_store_name').textContent=S.store.name+' — Catálogo';
 loadAll();
}
boot();
window.switchTab=switchTab;window.createCat=createCat;window.openCatModal=openCatModal;window.closeCatModal=closeCatModal;window.saveCat=saveCat;window.delCat=delCat;window.openProdModal=openProdModal;window.closeProdModal=closeProdModal;window.previewImg=previewImg;window.saveProd=saveProd;window.delProd=delProd;
</script>
</body>
</html>
