<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Anote — Cozinha</title>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";
window.supabase=createClient("https://mrchckrrkkvkmhpgellp.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yY2hja3Jya2t2a21ocGdlbGxwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1NDU4NTYsImV4cCI6MjA4OTEyMTg1Nn0.sIhnEkNV7614lZj3WKFFjSvyxLqVf0ReNu-ka88eUjk");
window.dispatchEvent(new Event("supabase-ready"));
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f172a;--card:#1e293b;--card2:#0b1220;--border:#2c3a52;--txt:#f1f5f9;--mut:#94a3b8;--green:#22c55e;--blue:#3b82f6;--amber:#f59e0b;--red:#ef4444;--r:14px}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt)}
.wrap{max-width:1200px;margin:0 auto;padding:16px}.hidden{display:none!important}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.title{font-size:20px;font-weight:800}
.muted{color:var(--mut);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;width:100%}
.btn-green{background:var(--green);color:#052e16}.btn-blue{background:var(--blue);color:#fff}.btn-amber{background:var(--amber);color:#3b2503}.btn-ghost{background:var(--card2);color:var(--txt);border:1px solid var(--border)}
input{width:100%;padding:12px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--txt);font-size:16px;margin-bottom:8px;outline:none;text-align:center;letter-spacing:4px;font-weight:800}
.login-shell{max-width:380px;margin:60px auto 0}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.msg{padding:10px;border-radius:10px;font-size:13px;margin-top:8px}
.msg.err{background:#451a1a;color:#fca5a5}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.col{background:var(--card2);border:1px solid var(--border);border-radius:var(--r);padding:12px;min-height:60vh}
.col h2{font-size:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.col h2 span{background:var(--card);padding:2px 10px;border-radius:999px;font-size:12px}
.order-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.o-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.o-top b{font-size:18px}
.badge{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--card2);color:var(--mut)}
.o-who{font-size:12px;color:var(--mut);margin-bottom:6px}
.item{font-size:14px;padding:3px 0;border-bottom:1px dashed var(--border)}
.item small{color:var(--mut)}
.o-notes{font-size:12px;color:var(--amber);margin:6px 0}
.order-card .btn{margin-top:8px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:12px;font-size:14px;font-weight:700;z-index:9999;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:800px){.board{grid-template-columns:1fr}.col{min-height:auto}}
</style>
</head>
<body>
<div class="wrap">

<div id="screen_login" class="hidden"><div class="login-shell">
<div class="card" style="text-align:center">
<div class="title">👨‍🍳 Cozinha</div>
<div class="muted" id="login_code_label" style="margin:6px 0 14px"></div>
<input id="pin" type="password" maxlength="4" placeholder="PIN" inputmode="numeric"/>
<button class="btn btn-green" onclick="doLogin()">Entrar</button>
<div id="login_msg"></div>
</div></div></div>

<div id="screen_app" class="hidden">
<div class="topbar">
 <div><div class="title">👨‍🍳 <span id="app_name">Cozinha</span></div><div class="muted" id="app_staff"></div></div>
 <div style="display:flex;gap:8px">
  <button class="btn btn-ghost" style="width:auto" onclick="loadOrders()">🔄</button>
  <button class="btn btn-ghost" style="width:auto" onclick="logout()">Sair</button>
 </div>
</div>
<div class="board">
 <div class="col"><h2>📥 Novos <span id="cnt_new">0</span></h2><div id="col_new"></div></div>
 <div class="col"><h2>👨‍ Preparando <span id="cnt_prep">0</span></h2><div id="col_prep"></div></div>
 <div class="col"><h2>🔔 Prontos <span id="cnt_ready">0</span></h2><div id="col_ready"></div></div>
</div>
</div>

</div>
<div id="toast" class="toast"></div>

<script>
const $=id=>document.getElementById(id);
let storeId=null,staffNome='',pollTimer=null,lastNew=-1,urlCode=null;

function toast(m,t='ok'){const e=$('toast');e.textContent=m;e.style.background=t==='err'?'#ef4444':'#22c55e';e.style.color=t==='err'?'#fff':'#052e16';e.classList.add('show');clearTimeout(e._tm);e._tm=setTimeout(()=>e.classList.remove('show'),2500)}
function waitSB(){return new Promise((res,rej)=>{if(window.supabase)return res();const t=setTimeout(()=>rej(),10000);window.addEventListener('supabase-ready',()=>{clearTimeout(t);res()},{once:true})})}
async function rpc(n,p={}){try{const{data,error}=await supabase.rpc(n,p);if(error)console.warn(n+':',error.message);return{data,error}}catch(e){console.warn(n+' exception:',e);return{data:null,error:e}}}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

async function boot(){
 try{await waitSB()}catch(e){return}
 // 1) Sessão salva da cozinha
 try{
  const s=JSON.parse(localStorage.getItem('anote_cozinha')||'null');
  if(s&&s.store_id){storeId=s.store_id;staffNome=s.nome||'';enter();return}
 }catch(e){}
 // 2) Dono logado
 const{data:ses}=await supabase.auth.getSession();
 if(ses&&ses.session){
  const{data}=await rpc('dono_entrar');
  if(data&&data.ok&&data.store){storeId=data.store.id;staffNome='Dono';enter();return}
 }
 // 3) Tela de PIN
 urlCode=new URLSearchParams(location.search).get('loja');
 $('login_code_label').textContent=urlCode?'Código: '+urlCode:'Abra pelo painel (botão Cozinha)';
 $('screen_login').classList.remove('hidden');
}
async function doLogin(){
 const pin=$('pin').value.trim();
 if(!urlCode){$('login_msg').innerHTML='<div class="msg err">Abra pelo botão Cozinha no painel.</div>';return}
 const{data}=await rpc('cozinha_login',{p_codigo:urlCode,p_pin:pin});
 if(data&&data.ok){
  storeId=data.store_id;staffNome=data.staff_nome||'';
  localStorage.setItem('anote_cozinha',JSON.stringify({store_id:storeId,nome:staffNome}));
  enter();
 }else $('login_msg').innerHTML='<div class="msg err">'+escapeHtml(data?.error||'Erro')+'</div>';
}
function logout(){localStorage.removeItem('anote_cozinha');location.reload()}
function enter(){
 $('screen_login').classList.add('hidden');
 $('screen_app').classList.remove('hidden');
 $('app_staff').textContent=staffNome?('👤 '+staffNome):'';
 loadOrders();
 if(pollTimer)clearInterval(pollTimer);
 pollTimer=setInterval(loadOrders,5000);
}

async function loadOrders(){
 if(!storeId)return;
 const{data}=await rpc('cozinha_pedidos',{p_store_id:storeId});
 if(!data||!data.ok)return;
 renderBoard(data.orders||[]);
}
function renderBoard(orders){
 $('col_new').innerHTML='';$('col_prep').innerHTML='';$('col_ready').innerHTML='';
 const cnt={new:0,preparing:0,ready:0};
 orders.forEach(o=>{
  if(cnt[o.status]!==undefined)cnt[o.status]++;
  const src=o.order_source==='delivery'?'🛵 Delivery':(o.order_type==='table'?'🪑 Mesa '+(o.table_number||''):'🥡 Balcão');
  const items=(o.items||[]).map(i=>'<div class="item">'+i.qty+'x '+escapeHtml(i.product_name||'')+(i.item_notes?'<small> — '+escapeHtml(i.item_notes)+'</small>':'')+'</div>').join('');
  let btn='';
  if(o.status==='new')btn='<button class="btn btn-amber" onclick="avancar(\''+o.id+'\',\'preparing\')">👨‍ Iniciar preparo</button>';
  if(o.status==='preparing')btn='<button class="btn btn-green" onclick="avancar(\''+o.id+'\',\'ready\')">🔔 Marcar pronto</button>';
  if(o.status==='ready')btn='<button class="btn btn-blue" onclick="avancar(\''+o.id+'\',\'delivered\')">✅ Concluir</button>';
  const card=document.createElement('div');card.className='order-card';
  card.innerHTML='<div class="o-top"><b>#'+o.order_number+'</b><span class="badge">'+escapeHtml(src)+'</span></div>'
   +(o.customer_name?'<div class="o-who">👤 '+escapeHtml(o.customer_name)+'</div>':'')
   +'<div>'+items+'</div>'
   +(o.notes?'<div class="o-notes">📝 '+escapeHtml(o.notes)+'</div>':'')
   +btn;
  $(o.status==='new'?'col_new':(o.status==='preparing'?'col_prep':'col_ready')).appendChild(card);
 });
 $('cnt_new').textContent=cnt.new;$('cnt_prep').textContent=cnt.preparing;$('cnt_ready').textContent=cnt.ready;
 if(lastNew>=0&&cnt.new>lastNew)beep();
 lastNew=cnt.new;
}
async function avancar(id,st){
 const{data}=await rpc('cozinha_atualizar_status',{p_order_id:id,p_status:st});
 if(data&&data.ok)loadOrders();else toast('Erro ao atualizar','err');
}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();setTimeout(()=>{o.stop();c.close()},400)}catch(e){}}

boot();
window.doLogin=doLogin;window.logout=logout;window.avancar=avancar;window.loadOrders=loadOrders;
</script>
</body>
</html>
