<script type="module">

window.dispatchEvent(new Event("supabase-ready"));
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f172a;--card:#1e293b;--card2:#0b1220;--border:#2c3a52;
  --txt:#f1f5f9;--mut:#94a3b8;--green:#22c55e;--blue:#3b82f6;
  --amber:#f59e0b;--red:#ef4444;--purple:#a855f7;--radius:14px
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.hidden{display:none!important}
.wrap{max-width:1600px;margin:0 auto;padding:14px}

/* TOPBAR */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.topbar-title{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.store-name{font-size:14px;color:var(--mut);font-weight:400}
.topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.live-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ef4444;animation:pulse 1.5s infinite}
.live-dot.on{background:#22c55e}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* BOTÕES */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn-green{background:var(--green);color:#052e16}
.btn-blue{background:var(--blue);color:#fff}
.btn-amber{background:var(--amber);color:#3b2503}
.btn-red{background:var(--red);color:#fff}
.btn-ghost{background:var(--card2);color:var(--txt);border:1px solid var(--border)}
.btn-block{width:100%}
.btn-lg{padding:16px 20px;font-size:16px;border-radius:12px}
.btn-sm{padding:6px 10px;font-size:12px}

/* LOGIN */
.login-shell{max-width:420px;margin:60px auto 0;padding:0 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.title{font-size:28px;font-weight:800;text-align:center;margin-bottom:6px}
.muted{color:var(--mut);font-size:13px}
input{width:100%;padding:13px 14px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--txt);font-size:15px;margin-bottom:12px;outline:none}
input.pin-input{text-align:center;font-size:28px;letter-spacing:12px;font-weight:800}
input:focus{border-color:var(--green)}
label{font-size:13px;color:var(--mut);font-weight:600;display:block;margin-bottom:6px}
.msg{padding:11px;border-radius:10px;font-size:14px;margin-top:10px;text-align:center}
.msg.err{background:#451a1a;color:#fca5a5;border:1px solid #7f1d1d}
.msg.ok{background:#14351f;color:#86efac;border:1px solid #166534}

/* ⭐ FILTROS POR TIPO */
.type-filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.type-filter{padding:12px 20px;border-radius:12px;background:var(--card2);border:2px solid var(--border);color:var(--mut);cursor:pointer;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;transition:all .15s}
.type-filter:hover{border-color:var(--mut)}
.type-filter.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.type-filter .count{background:rgba(0,0,0,.2);padding:2px 10px;border-radius:999px;font-size:13px}
.type-filter.active .count{background:rgba(255,255,255,.2)}

/* KANBAN */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.kcol{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:12px;min-height:60vh}
.kcol-header{text-align:center;padding:12px;border-radius:10px;margin-bottom:12px;font-weight:800;font-size:16px}
.kcol-new .kcol-header{background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid #3b82f6}
.kcol-prep .kcol-header{background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid #f59e0b}
.kcol-ready .kcol-header{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid #22c55e}
.kcount{display:inline-block;background:rgba(0,0,0,.3);padding:2px 10px;border-radius:999px;font-size:13px;margin-left:6px}

/* CARDS DE PEDIDO */
.order-card{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;transition:border-color .3s}
.order-card.urgent{border-color:var(--red);animation:blink 1s infinite}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
.order-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px dashed var(--border)}
.order-num{font-size:20px;font-weight:800}
.order-time{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--card2)}
.order-time.fast{color:#4ade80}
.order-time.medium{color:#fbbf24}
.order-time.slow{color:#f87171}

/* ⭐ BADGES DE TIPO */
.order-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.type-badge{font-size:13px;font-weight:800;padding:6px 12px;border-radius:8px;display:inline-flex;align-items:center;gap:4px}
.type-badge.table{background:#312e81;color:#c7d2fe}
.type-badge.counter{background:#164e63;color:#67e8f9}
.type-badge.delivery{background:#7c2d12;color:#fdba74}
.type-badge.pickup{background:#4c1d95;color:#ddd6fe}
.order-items{font-size:16px;line-height:1.7;margin-bottom:12px}
.order-items b{color:var(--amber);font-size:17px}
.item-note{font-size:13px;color:var(--amber);font-style:italic;display:block;padding-left:20px}
.empty-col{text-align:center;color:var(--mut);padding:40px 10px;font-size:14px}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.b-ready{background:#dcfce7;color:#15803d}

/* RESPONSIVO */
@media(max-width:900px){
  .kanban{grid-template-columns:1fr}
  .kcol{min-height:auto}
  .type-filters{flex-direction:column}
  .type-filter{width:100%;justify-content:center}
}
@media(min-width:1400px){
  .order-items{font-size:18px}
  .order-num{font-size:24px}
}
</style>
</head>
<body>

<!-- ============ TELA DE LOGIN ============ -->
<div id="screen_login">
  <div class="login-shell">
    <div style="text-align:center;margin-bottom:20px">
      <div class="title">👨‍🍳</div>
      <div class="title" style="font-size:24px">Cozinha</div>
      <div class="muted">Anote — Painel da Cozinha</div>
    </div>
    <div class="card">
      <div class="muted" style="text-align:center;margin-bottom:14px" id="login_store_name">Digite seu PIN para entrar</div>
      <label style="text-align:center">Seu PIN</label>
      <input type="password" inputmode="numeric" maxlength="4" id="login_pin" class="pin-input" placeholder="••••" autofocus/>
      <button class="btn btn-green btn-block btn-lg" onclick="doLogin()">🔓 Entrar na cozinha</button>
      <div id="login_result"></div>
      <div class="muted" style="margin-top:16px;text-align:center">Esqueceu o PIN? Peça ao dono da loja.</div>
    </div>
  </div>
</div>

<!-- ============ TELA DA COZINHA ============ -->
<div id="screen_kitchen" class="hidden">
  <div class="wrap">
    <!-- TOPBAR -->
    <div class="topbar">
      <div class="topbar-title">
        👨‍🍳 Cozinha
        <span class="store-name" id="k_store_name"></span>
      </div>
      <div class="topbar-actions">
        <span class="live-dot" id="live_dot"></span>
        <span class="muted" id="last_update">—</span>
        <button class="btn btn-ghost btn-sm" onclick="toggleSound()" id="btn_sound">🔊 Som: ON</button>
        <button class="btn btn-ghost btn-sm" onclick="loadData()">🔄</button>
        <button class="btn btn-red btn-sm" onclick="logout()">Sair</button>
      </div>
    </div>

    <!-- ⭐ FILTROS POR TIPO DE COMANDA -->
    <div class="type-filters">
      <div class="type-filter active" id="filter_all" onclick="setFilter('all')">
        📋 Todos <span class="count" id="count_all">0</span>
      </div>
      <div class="type-filter" id="filter_table" onclick="setFilter('table')">
        🍽️ Mesas <span class="count" id="count_table">0</span>
      </div>
      <div class="type-filter" id="filter_counter" onclick="setFilter('counter')">
        🏪 Balcão <span class="count" id="count_counter">0</span>
      </div>
      <div class="type-filter" id="filter_delivery" onclick="setFilter('delivery')">
        🛵 Delivery <span class="count" id="count_delivery">0</span>
      </div>
      <div class="type-filter" id="filter_pickup" onclick="setFilter('pickup')">
        🥡 Retirada <span class="count" id="count_pickup">0</span>
      </div>
    </div>

    <!-- KANBAN -->
    <div class="kanban">
      <div class="kcol kcol-new">
        <div class="kcol-header">🆕 NOVOS <span class="kcount" id="kcount_new">0</span></div>
        <div id="k_new"></div>
      </div>
      <div class="kcol kcol-prep">
        <div class="kcol-header">👨‍🍳 PREPARANDO <span class="kcount" id="kcount_prep">0</span></div>
        <div id="k_prep"></div>
      </div>
      <div class="kcol kcol-ready">
        <div class="kcol-header">🔔 PRONTOS <span class="kcount" id="kcount_ready">0</span></div>
        <div id="k_ready"></div>
      </div>
    </div>
  </div>
</div>

<script>
let store=null,staff=null,staffCode=null,D={orders:[],tables:[]};
let liveTimer=null,soundOn=true,currentFilter='all';
let lastOrderIds=[];

const STATUS={new:'Novo',preparing:'Preparando',ready:'Pronto'};
const TYPE_LABEL={counter:'🏪 Balcão',delivery:'🛵 Delivery',pickup:'🥡 Retirada',table:'🍽️ Mesa'};
const TYPE_ICON={counter:'🏪',delivery:'🛵',pickup:'🥡',table:'🍽️'};

function waitForSupabase(){
  return new Promise((res,rej)=>{
    if(window.supabase)return res();
    const t=setTimeout(()=>rej(),10000);
    window.addEventListener('supabase-ready',()=>{clearTimeout(t);res()},{once:true});
  });
}

// ============ LOGIN ============
function getLojaFromURL(){
  const p=new URLSearchParams(location.search);
  return p.get('loja')||'';
}

async function doLogin(){
  const pin=document.getElementById('login_pin').value.trim();
  const loja=getLojaFromURL();
  const res=document.getElementById('login_result');
  
  if(!loja){
    res.innerHTML='<div class="msg err">Código da loja não encontrado. Escaneie o QR Code.</div>';
    return;
  }
  if(!pin||pin.length!==4){
    res.innerHTML='<div class="msg err">Digite seu PIN de 4 números.</div>';
    return;
  }
  
  res.innerHTML='<div class="msg ok">Verificando...</div>';
  
  const{data}=await supabase.rpc('staff_login_pin',{p_store_code:loja,p_pin:pin});
  
  if(!data||!data.ok){
    res.innerHTML=`<div class="msg err">${data?.error||'PIN inválido'}</div>`;
    document.getElementById('login_pin').value='';
    return;
  }
  
  // Verificar cargo
  if(data.staff.cargo!=='kitchen'&&data.staff.cargo!=='manager'){
    res.innerHTML='<div class="msg err">Este PIN não tem acesso à cozinha.</div>';
    return;
  }
  
  store=data.store;
  staff=data.staff;
  staffCode=data.store.staff_code;
  
  localStorage.setItem('anote_kitchen_session',JSON.stringify({loja:loja,pin:pin}));
  
  enterKitchen();
}

function logout(){
  localStorage.removeItem('anote_kitchen_session');
  stopLive();
  location.href='index.html';
}

function enterKitchen(){
  document.getElementById('screen_login').classList.add('hidden');
  document.getElementById('screen_kitchen').classList.remove('hidden');
  document.getElementById('k_store_name').textContent='• '+store.name+' • Olá, '+staff.nome+'! 👋';
  loadData();
  startLive();
}

// ============ DADOS ============
async function loadData(){
  if(!store||!staffCode)return;
  const{data}=await supabase.rpc('staff_carregar',{p_store_id:store.id,p_codigo:staffCode});
  if(!data||!data.ok){
    if(data?.error==='Código inválido'){logout();return}
    return;
  }
  D=data;
  renderKitchen();
  document.getElementById('live_dot').classList.add('on');
  document.getElementById('last_update').textContent='Atualizado: '+new Date().toLocaleTimeString('pt-BR');
}

function startLive(){
  if(liveTimer)return;
  liveTimer=setInterval(loadData,4000);
}
function stopLive(){
  if(liveTimer){clearInterval(liveTimer);liveTimer=null}
}

// ============ ⭐ FILTROS POR TIPO ============
function setFilter(type){
  currentFilter=type;
  ['all','table','counter','delivery','pickup'].forEach(t=>{
    document.getElementById('filter_'+t).classList.toggle('active',t===type);
  });
  renderKitchen();
}

function updateFilterCounts(orders){
  document.getElementById('count_all').textContent=orders.length;
  document.getElementById('count_table').textContent=orders.filter(o=>o.order_type==='table').length;
  document.getElementById('count_counter').textContent=orders.filter(o=>o.order_type==='counter').length;
  document.getElementById('count_delivery').textContent=orders.filter(o=>o.order_type==='delivery').length;
  document.getElementById('count_pickup').textContent=orders.filter(o=>o.order_type==='pickup').length;
}

function getFilteredOrders(){
  const active=D.orders.filter(o=>['new','preparing','ready'].includes(o.status));
  if(currentFilter==='all')return active;
  return active.filter(o=>o.order_type===currentFilter);
}

// ============ TEMPO DO PEDIDO ============
function getElapsed(createdAt){
  if(!createdAt)return{text:'--:--',cls:'fast'};
  const diff=Math.floor((Date.now()-new Date(createdAt).getTime())/60000);
  if(diff<5)return{text:diff+'min',cls:'fast'};
  if(diff<12)return{text:diff+'min',cls:'medium'};
  return{text:diff+'min ⚠️',cls:'slow'};
}

// ============ RENDER KANBAN ============
function renderKitchen(){
  const filtered=getFilteredOrders();
  updateFilterCounts(D.orders.filter(o=>['new','preparing','ready'].includes(o.status)));
  
  const g={new:[],preparing:[],ready:[]};
  filtered.forEach(o=>{if(g[o.status])g[o.status].push(o)});

  // Detectar novos pedidos para som
  const currentIds=filtered.filter(o=>o.status==='new').map(o=>o.id);
  const hasNew=currentIds.some(id=>!lastOrderIds.includes(id));
  if(hasNew&&lastOrderIds.length>0&&soundOn)beep();
  lastOrderIds=currentIds;

  document.getElementById('kcount_new').textContent=g.new.length;
  document.getElementById('kcount_prep').textContent=g.preparing.length;
  document.getElementById('kcount_ready').textContent=g.ready.length;

  // NOVOS
  document.getElementById('k_new').innerHTML=g.new.length
    ?g.new.map(o=>renderCard(o,`
        <button class="btn btn-amber btn-block btn-lg" onclick="setStatus('${o.id}','preparing')">
          👨‍🍳 COMEÇAR PREPARO
        </button>`)).join('')
    :'<div class="empty-col">Nenhum pedido novo 🎉</div>';

  // PREPARANDO
  document.getElementById('k_prep').innerHTML=g.preparing.length
    ?g.preparing.map(o=>renderCard(o,`
        <button class="btn btn-green btn-block btn-lg" onclick="setStatus('${o.id}','ready')">
          🔔 FINALIZAR / PRONTO
        </button>`)).join('')
    :'<div class="empty-col">Nada em preparo</div>';

  // PRONTOS
  document.getElementById('k_ready').innerHTML=g.ready.length
    ?g.ready.map(o=>renderCard(o,`
        <div style="text-align:center;padding:10px">
          <span class="badge b-ready">✅ Aguardando entrega</span>
        </div>`)).join('')
    :'<div class="empty-col">Nenhum pronto</div>';
}

function renderCard(o,actionHtml){
  const elapsed=getElapsed(o.created_at);
  const isUrgent=o.status==='new'&&elapsed.cls==='slow';
  const table=D.tables.find(t=>t.id===o.table_id);
  const items=(o.items||[]).map(i=>{
    return `<div>🍴 <b>${i.qty}x</b> ${i.name}${i.notes?`<span class="item-note">📝 ${i.notes}</span>`:''}</div>`;
  }).join('')||'<div class="muted">Sem itens</div>';

  // Badge do tipo
  let typeBadge='';
  if(o.order_type==='table'){
    typeBadge=`<span class="type-badge table">🍽️ Mesa ${table?table.table_number:'?'}</span>`;
  }else if(o.order_type==='counter'){
    typeBadge=`<span class="type-badge counter">🏪 Balcão</span>`;
  }else if(o.order_type==='delivery'){
    typeBadge=`<span class="type-badge delivery">🛵 Delivery</span>`;
  }else if(o.order_type==='pickup'){
    typeBadge=`<span class="type-badge pickup">🥡 Retirada</span>`;
  }

  return `
    <div class="order-card ${isUrgent?'urgent':''}">
      <div class="order-head">
        <span class="order-num">#${o.order_number}</span>
        <span class="order-time ${elapsed.cls}">⏱️ ${elapsed.text}</span>
      </div>
      <div class="order-meta">${typeBadge}</div>
      <div class="order-items">${items}</div>
      ${o.notes?`<div class="item-note" style="margin-bottom:10px">📝 Geral: ${o.notes}</div>`:''}
      ${actionHtml}
    </div>`;
}

// ============ AÇÕES ============
async function setStatus(id,s){
  await supabase.rpc('staff_atualizar_pedido',{
    p_store_id:store.id,
    p_codigo:staffCode,
    p_order_id:id,
    p_status:s,
    p_payment:null
  });
  await loadData();
}

function toggleSound(){
  soundOn=!soundOn;
  document.getElementById('btn_sound').textContent=soundOn?'🔊 Som: ON':'🔇 Som: OFF';
}

function beep(){
  try{
    const c=new(window.AudioContext||window.webkitAudioContext)();
    [0,200,400].forEach(delay=>{
      setTimeout(()=>{
        const o=c.createOscillator(),g=c.createGain();
        o.connect(g);g.connect(c.destination);
        o.frequency.value=880;g.gain.value=.15;
        o.start();
        setTimeout(()=>o.stop(),150);
      },delay);
    });
    setTimeout(()=>c.close(),800);
  }catch(e){}
}

// ============ BOOT ============
async function boot(){
  try{await waitForSupabase()}catch(e){return}
  
  const loja=getLojaFromURL();
  
  // Tentar sessão salva
  const saved=localStorage.getItem('anote_kitchen_session');
  if(saved){
    try{
      const{loja:sLoja,pin:sPin}=JSON.parse(saved);
      if(sLoja===loja&&sPin){
        const{data}=await supabase.rpc('staff_login_pin',{p_store_code:sLoja,p_pin:sPin});
        if(data&&data.ok&&(data.staff.cargo==='kitchen'||data.staff.cargo==='manager')){
          store=data.store;
          staff=data.staff;
          staffCode=data.store.staff_code;
          enterKitchen();
          return;
        }
      }
    }catch(e){}
  }
  
  // Mostrar tela de login
  if(loja){
    const{data}=await supabase.rpc('staff_entrar',{p_codigo:loja});
    if(data&&data.ok){
      document.getElementById('login_store_name').textContent=`${data.store.name} • Digite seu PIN`;
    }
  }
  document.getElementById('screen_login').classList.remove('hidden');
}
boot();

// Expor funções
window.doLogin=doLogin;
window.logout=logout;
window.loadData=loadData;
window.setFilter=setFilter;
window.setStatus=setStatus;
window.toggleSound=toggleSound;
</script>
</body>
</html>
