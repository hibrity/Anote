<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Anote — Caixa</title>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";
window.supabase=createClient("https://mrchckrrkkvkmhpgellp.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yY2hja3Jya2t2a21ocGdlbGxwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1NDU4NTYsImV4cCI6MjA4OTEyMTg1Nn0.sIhnEkNV7614lZj3WKFFjSvyxLqVf0ReNu-ka88eUjk");
window.dispatchEvent(new Event("supabase-ready"));
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f172a;--card:#1e293b;--card2:#0b1220;--border:#2c3a52;--txt:#f1f5f9;--mut:#94a3b8;--green:#22c55e;--red:#ef4444;--radius:14px}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt)}
.wrap{max-width:760px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
h2{font-size:18px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.btn-green{background:var(--green);color:#052e16}.btn-red{background:var(--red);color:#fff}.btn-ghost{background:var(--card2);color:var(--txt);border:1px solid var(--border)}
input{width:100%;padding:12px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--txt);font-size:15px;margin-bottom:10px;outline:none}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px;font-weight:600}
.row{display:flex;gap:8px}.row>*{flex:1}
.muted{color:var(--mut);font-size:13px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.title{font-size:24px;font-weight:800}
.item{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.msg{padding:11px;border-radius:10px;font-size:14px;margin-top:10px}
.msg.err{background:#451a1a;color:#fca5a5}.msg.ok{background:#14351f;color:#86efac}
.big{font-size:26px;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
<div class="topbar"><div><div class="title">💰 Caixa</div><div class="muted" id="store_name">...</div></div><button class="btn btn-ghost" onclick="location.href='index.html'">← Voltar</button></div>
<div id="bill_alerts"></div>
<div class="card"><h2>Controle de caixa</h2><label>Valor de abertura</label><input id="cx_valor" type="number" step="0.01"/><div class="row"><button class="btn btn-green" onclick="caixa('abrir')">🔓 Abrir</button><button class="btn btn-red" onclick="caixa('fechar')">🔒 Fechar</button></div><div id="cx_res"></div></div>
<div class="card"><h2>Caixa atual</h2><div id="cx_info"></div></div>
<div class="card"><h2>Resumo de hoje</h2><div id="cx_resumo"></div></div>
</div>
<script>
let store=null;
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function waitForSupabase(){return new Promise((res,rej)=>{if(window.supabase)return res();const t=setTimeout(()=>rej(),10000);window.addEventListener('supabase-ready',()=>{clearTimeout(t);res()},{once:true})})}
async function boot(){try{await waitForSupabase()}catch(e){location.href='index.html';return}const{data:s}=await supabase.auth.getSession();if(!s.session){location.href='index.html';return}const{data}=await supabase.rpc('dono_entrar');if(!data||!data.ok){location.href='index.html';return}store=data.store;document.getElementById('store_name').textContent=store.name;loadCaixa();loadResumo();refreshBills();setInterval(refreshBills,5000)}
async function caixa(a){const v=Number(document.getElementById('cx_valor').value||0);const{data}=await supabase.rpc('dono_caixa',{p_store_id:store.id,p_acao:a,p_valor:v});const b=document.getElementById('cx_res');if(!data||!data.ok){b.innerHTML=`<div class="msg err">${data?.error||'Erro'}</div>`}else if(a==='fechar'){b.innerHTML=`<div class="msg ok">Fechado! Vendas: ${money(data.sales_total)}</div>`}else{b.innerHTML='<div class="msg ok">Aberto!</div>'}document.getElementById('cx_valor').value='';loadCaixa();loadResumo()}
async function loadCaixa(){const{data}=await supabase.rpc('dono_caixa',{p_store_id:store.id,p_acao:'info',p_valor:0});const b=document.getElementById('cx_info');if(!data||!data.ok){b.innerHTML='<div class="muted">Erro.</div>';return}b.innerHTML=data.open?`<div class="item"><b style="color:var(--green)">🟢 ABERTO</b><br>Abertura: ${money(data.opening_amount)}<br>${new Date(data.opened_at).toLocaleString('pt-BR')}</div>`:`<div class="item"><b style="color:var(--red)">🔴 FECHADO</b></div>`}
async function loadResumo(){const{data}=await supabase.rpc('dono_dashboard',{p_store_id:store.id});if(!data||!data.ok)return;const s=data.stats;document.getElementById('cx_resumo').innerHTML=`<div class="item">Pedidos hoje: <span class="big">${s.today_orders}</span></div><div class="item">Faturamento: <span class="big" style="color:var(--green)">${money(s.today_revenue)}</span></div>`}
async function refreshBills(){if(!store||!store.staff_code)return;const{data}=await supabase.rpc('staff_alertas',{p_store_id:store.id,p_codigo:store.staff_code});const{data:all}=await supabase.rpc('staff_carregar',{p_store_id:store.id,p_codigo:store.staff_code});const b=document.getElementById('bill_alerts');if(!data||!data.ok){b.innerHTML='';return}const bills=(data.alerts||[]).filter(a=>a.type==='bill');if(!bills.length){b.innerHTML='';return}const orders=(all&&all.ok)?all.orders:[];b.innerHTML='<div class="card"><h2>🔔 Pedidos de conta</h2>'+bills.map(a=>{const t=orders.filter(o=>String(o.table_number)===String(a.table_number)&&o.status!=='cancelled').reduce((s,o)=>s+Number(o.total||0),0);return`<div class="item">💳 <b>Mesa ${a.table_number}</b> pediu a conta! • Consumo: ${money(t)}<br><button class="btn btn-green" style="margin-top:8px" onclick="confirmarConta('${a.id}')">✅ Conferi, confirmar</button></div>`}).join('')+'</div>'}
async function confirmarConta(id){await supabase.rpc('staff_alerta_ack',{p_store_id:store.id,p_codigo:store.staff_code,p_alert_id:id});refreshBills()}
boot();
window.caixa=caixa;window.confirmarConta=confirmarConta;
</script>
</body>
</html>
