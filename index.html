<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Anote — Painel</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";
window.supabase=createClient("https://mrchckrrkkvkmhpgellp.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yY2hja3Jya2t2a21ocGdlbGxwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1NDU4NTYsImV4cCI6MjA4OTEyMTg1Nn0.sIhnEkNV7614lZj3WKFFjSvyxLqVf0ReNu-ka88eUjk");
window.dispatchEvent(new Event("supabase-ready"));
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f172a;--card:#1e293b;--card2:#0b1220;--border:#2c3a52;--txt:#f1f5f9;--mut:#94a3b8;--green:#22c55e;--blue:#3b82f6;--amber:#f59e0b;--red:#ef4444;--r:14px}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt)}
.wrap{max-width:1100px;margin:0 auto;padding:16px}.hidden{display:none!important}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px}
h2{font-size:17px;margin-bottom:12px}h3{font-size:14px;margin-bottom:8px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-green{background:var(--green);color:#052e16}.btn-blue{background:var(--blue);color:#fff}.btn-amber{background:var(--amber);color:#3b2503}.btn-red{background:var(--red);color:#fff}.btn-ghost{background:var(--card2);color:var(--txt);border:1px solid var(--border)}.btn-block{width:100%}.btn-sm{padding:6px 10px;font-size:12px}
input{width:100%;padding:10px 12px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--txt);font-size:14px;margin-bottom:8px;outline:none}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px;font-weight:600}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
.muted{color:var(--mut);font-size:13px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.title{font-size:20px;font-weight:800}
.stat{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px}.stat b{display:block;font-size:22px;margin-top:4px}
.msg{padding:10px;border-radius:10px;font-size:13px;margin-top:8px}
.msg.err{background:#451a1a;color:#fca5a5}.msg.ok{background:#14351f;color:#86efac}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.nav .btn{flex:1;min-width:120px;padding:14px}
.login-shell{max-width:440px;margin:50px auto 0}
.login-tabs{display:flex;gap:8px;margin-bottom:16px}
.login-tab{flex:1;padding:12px;text-align:center;border-radius:10px;background:var(--card2);border:1px solid var(--border);cursor:pointer;font-weight:700;color:var(--mut);font-size:13px}
.login-tab.active{background:var(--green);color:#052e16}
.qr-item{display:inline-block;text-align:center;margin:10px;padding:14px;background:#fff;border-radius:12px;vertical-align:top}
.qr-label{margin-top:8px;font-weight:700;color:#1c1917}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{padding:10px 16px;border-radius:10px;background:var(--card2);border:1px solid var(--border);color:var(--mut);cursor:pointer;font-weight:700;font-size:14px}
.tab.active{background:var(--green);color:#052e16}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:12px;font-size:14px;font-weight:700;z-index:9999;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(4px)}
@media(max-width:800px){.grid3{grid-template-columns:1fr}}
@media print{body *{visibility:hidden}.print-area,.print-area *{visibility:visible}.print-area{position:absolute;left:0;top:0;width:100%}.btn{display:none!important}}
</style>
</head>
<body>
<div class="wrap">

<div id="screen_login"><div class="login-shell">
<div style="text-align:center;margin-bottom:24px"><div class="title">Anote</div><div class="muted">Crie sua loja ou entre</div></div>
<div class="card"><div class="login-tabs">
<div class="login-tab active" id="lt_new" onclick="switchEntry('new')">🏪 Criar loja</div>
<div class="login-tab" id="lt_login" onclick="switchEntry('login')">🔑 Já tenho conta</div></div>
<div id="entry_new"><h3>Dados do responsável</h3><label>Seu nome</label><input id="new_owner_name"/><label>Email</label><input id="new_email" type="email"/><label>Senha</label><input id="new_pass" type="password"/><h3 style="margin-top:16px">Dados da loja</h3><label>Nome da loja</label><input id="new_store_name"/><label>Telefone</label><input id="new_store_phone"/><label>Endereço</label><input id="new_store_address"/><button class="btn btn-green btn-block" onclick="createStore()">Criar minha loja</button><div id="new_result"></div></div>
<div id="entry_login" class="hidden"><label>Email</label><input id="log_email" type="email"/><label>Senha</label><input id="log_pass" type="password"/><button class="btn btn-green btn-block" onclick="ownerLogin()">Entrar</button><div id="login_result"></div></div>
</div></div></div>

<div id="screen_app" class="hidden">
<div class="topbar"><div><div class="title" id="app_store_name">Loja</div><div class="muted">👑 Dono</div></div>
<div class="row" style="max-width:340px"><button class="btn btn-ghost" onclick="refreshAll()">🔄 Atualizar</button><button class="btn btn-red" onclick="logout()">Sair</button></div></div>

<div id="alerts_wrap"></div>

<div class="nav">
<button class="btn btn-blue" onclick="location.href='catalogo.html'">📦 Catálogo</button>
<button class="btn btn-blue" onclick="location.href='pedidos.html'">🧾 Pedidos</button>
<button class="btn btn-blue" onclick="location.href='equipe.html'">👥 Equipe</button>
<button class="btn btn-amber" id="btn_cozinha">👨‍🍳 Cozinha</button>
</div>

<div class="tabs">
<div class="tab active" id="tb_painel" onclick="openTab('painel')">📊 Painel</div>
<div class="tab" id="tb_mesas" onclick="openTab('mesas')">🔳 Mesas</div>
</div>

<div id="tab_painel"><div class="card"><h2>📊 Resumo</h2><div class="grid3" id="stats"></div></div></div>

<div id="tab_mesas" class="hidden"><div class="card print-area"><h2>🔳 QR Codes das mesas</h2>
<div style="padding:14px;background:var(--card2);border-radius:12px">
<div class="row" style="margin-bottom:10px">
<input id="qr_mesa_num" placeholder="Número da mesa (ex: 5)" style="margin-bottom:0"/>
<button class="btn btn-green" id="btn_create_mesa" onclick="createMesa()">➕ Gerar QR</button>
</div>
<div style="display:flex;gap:8px;margin-bottom:10px">
<button class="btn btn-ghost btn-sm" onclick="forceRenderMesas()">🔄 Atualizar QR codes</button>
<button class="btn btn-blue btn-sm" onclick="window.print()">🖨️ Imprimir tudo</button>
</div>
<div id="qr_container" style="margin-top:14px"></div>
</div></div></div>
</div>
</div>
<div id="toast" class="toast"></div>

<script>
const $=id=>document.getElementById(id);
let S={store:null,code:null},D={tables:[]},liveTimer=null,lastAlerts=0;
function toast(m,t='ok'){const e=$('toast');e.textContent=m;e.style.background=t==='err'?'#ef4444':'#22c55e';e.style.color=t==='err'?'#fff':'#052e16';e.classList.add('show');clearTimeout(e._tm);e._tm=setTimeout(()=>e.classList.remove('show'),2500)}
function waitSB(){return new Promise((res,rej)=>{if(window.supabase)return res();const t=setTimeout(()=>rej(),10000);window.addEventListener('supabase-ready',()=>{clearTimeout(t);res()},{once:true})})}
async function rpc(n,p={}){const{data,error}=await supabase.rpc(n,p);if(error)console.warn(n+':',error.message);return{data,error}}

// ---------- LOGIN ----------
function switchEntry(m){['new','login'].forEach(x=>{$('lt_'+x).classList.toggle('active',x===m);$('entry_'+x).classList.toggle('hidden',x!==m)})}
async function createStore(){
 const on=$('new_owner_name').value.trim(),e=$('new_email').value.trim(),p=$('new_pass').value,sn=$('new_store_name').value.trim(),b=$('new_result');
 if(!on||!e||!p||!sn){b.innerHTML='<div class="msg err">Preencha nome, email, senha e loja.</div>';return}
 b.innerHTML='<div class="msg ok">Criando conta...</div>';
 const{error}=await supabase.auth.signUp({email:e,password:p,options:{data:{name:on}}});
 if(error){b.innerHTML=`<div class="msg err">${error.message}</div>`;return}
 for(let i=0;i<10;i++){const{data}=await supabase.auth.getSession();if(data.session)break;await new Promise(r=>setTimeout(r,400))}
 const{data}=await rpc('dono_criar_loja',{p_nome:sn,p_telefone:$('new_store_phone').value.trim(),p_endereco:$('new_store_address').value.trim()});
 if(!data||!data.ok){b.innerHTML=`<div class="msg err">${data?.error||'Erro ao criar loja'}</div>`;return}
 await enterApp();
}
async function ownerLogin(){
 const b=$('login_result');b.innerHTML='<div class="msg ok">Entrando...</div>';
 const{error}=await supabase.auth.signInWithPassword({email:$('log_email').value.trim(),password:$('log_pass').value});
 if(error){b.innerHTML=`<div class="msg err">${error.message}</div>`;return}
 await enterApp();
}
async function enterApp(){
 const{data}=await rpc('dono_entrar');
 if(!data||!data.ok||!data.store){show('login');return}
 let st=data.store;
 if(!st.staff_code){const r=await rpc('dono_regenerar_codigo',{p_store_id:st.id});if(r.data?.ok)st.staff_code=r.data.staff_code;else{show('login');return}}
 S.store=st;S.code=st.staff_code;
 show('app');$('app_store_name').textContent=st.name;
 $('btn_cozinha').onclick=()=>location.href='cozinha.html?loja='+encodeURIComponent(S.code);
 refreshAll();startLive();
}
function logout(){supabase.auth.signOut();stopLive();show('login')}
function show(s){$('screen_login').classList.toggle('hidden',s!=='login');$('screen_app').classList.toggle('hidden',s!=='app')}
function openTab(t){['painel','mesas'].forEach(x=>{$('tab_'+x).classList.toggle('hidden',x!==t);$('tb_'+x).classList.toggle('active',x===t)});if(t==='mesas')renderMesasQR()}
function startLive(){if(liveTimer)return;liveTimer=setInterval(refreshAll,5000)}
function stopLive(){if(liveTimer){clearInterval(liveTimer);liveTimer=null}}

// ---------- DADOS ----------
async function refreshAll(){
 if(!S.store)return;
 const{data}=await rpc('staff_carregar',{p_store_id:S.store.id,p_codigo:S.code});
 if(data&&data.ok){D=data;if(!$('tab_mesas').classList.contains('hidden'))renderMesasQR()}
 const d=await rpc('dono_dashboard',{p_store_id:S.store.id});
 if(d.data?.ok){const s=d.data.stats;$('stats').innerHTML=`<div class="stat">Produtos<b>${s.total_products}</b></div><div class="stat">Clientes<b>${s.total_customers}</b></div><div class="stat">Pedidos<b>${s.total_orders}</b></div><div class="stat">Em aberto<b>${s.open_orders}</b></div><div class="stat">Hoje<b>${s.today_orders}</b></div><div class="stat">Fat. hoje<b>${Number(s.today_revenue||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</b></div>`}
 renderAlerts();
}

// ---------- ALERTAS ----------
async function renderAlerts(){
 const{data}=await rpc('staff_alertas',{p_store_id:S.store.id,p_codigo:S.code});
 if(!data?.ok)return;
 const a=data.alerts||[];
 if(a.length>lastAlerts)beep();
 lastAlerts=a.length;
 $('alerts_wrap').innerHTML=a.map(x=>{
  const m=x.table_number||'?';
  if(x.type==='waiter')return x.status==='ack'
   ?`<div class="msg ok" style="margin-bottom:8px">🏃 <b>Mesa ${m}</b> — garçom a caminho <button class="btn btn-green btn-sm" onclick="doneAlert('${x.id}')">✔ Concluir</button></div>`
   :`<div class="msg err" style="margin-bottom:8px">🔔 <b>Mesa ${m}</b> chamando! <button class="btn btn-green btn-sm" onclick="ackAlert('${x.id}')">✅ Vou lá</button></div>`;
  return x.status==='ack'
   ?`<div class="msg ok" style="margin-bottom:8px">💳 <b>Mesa ${m}</b> — conta confirmada <button class="btn btn-blue btn-sm" onclick="doneAlert('${x.id}')">✔ Concluir</button></div>`
   :`<div class="msg err" style="margin-bottom:8px">💳 <b>Mesa ${m}</b> pediu a conta! <button class="btn btn-blue btn-sm" onclick="ackAlert('${x.id}')">✅ Confirmar</button></div>`;
 }).join('');
}
async function ackAlert(id){await rpc('staff_alerta_ack',{p_store_id:S.store.id,p_codigo:S.code,p_alert_id:id});renderAlerts()}
async function doneAlert(id){await rpc('staff_alerta_done',{p_store_id:S.store.id,p_codigo:S.code,p_alert_id:id});renderAlerts()}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.1;o.start();setTimeout(()=>{o.stop();c.close()},300)}catch(e){}}

// ---------- MESAS (CORRIGIDO) ----------
async function createMesa(){
 const n=$('qr_mesa_num').value.trim();
 if(!n){toast('Digite o número da mesa','err');return}
 const btn=$('btn_create_mesa');
 btn.disabled=true;btn.textContent='Criando...';
 const{data}=await rpc('dono_criar_mesa',{p_store_id:S.store.id,p_numero:n});
 btn.disabled=false;btn.textContent='➕ Gerar QR';
 if(data?.ok){
  $('qr_mesa_num').value='';
  toast('Mesa criada! ✅');
  await reloadMesas();
 }else{
  toast(data?.error||'Erro ao criar mesa','err');
 }
}
async function reloadMesas(){
 const{data}=await rpc('staff_carregar',{p_store_id:S.store.id,p_codigo:S.code});
 if(data?.ok){D=data;renderMesasQR()}
}
function forceRenderMesas(){toast('Atualizando...');reloadMesas()}
function renderMesasQR(){
 const c=$('qr_container');
 if(typeof QRCode==='undefined'){c.innerHTML='<div class="msg err">QR não carregou. Recarregue a página.</div>';return}
 c.innerHTML='';
 if(!D.tables||!D.tables.length){c.innerHTML='<div class="muted" style="text-align:center;padding:30px">Nenhuma mesa cadastrada.<br>Gere a primeira mesa acima! 👆</div>';return}
 D.tables.forEach(t=>{
  const u=`${location.href.substring(0,location.href.lastIndexOf('/')+1)}cliente.html?loja=${S.store.id}&mesa=${t.id}`;
  const d=document.createElement('div');d.className='qr-item';
  d.innerHTML=`<div id="qr_${t.id}"></div><div class="qr-label">Mesa ${t.table_number}</div><div style="margin-top:8px;display:flex;gap:6px;justify-content:center"><button class="btn btn-blue btn-sm" onclick="editMesa('${t.id}','${t.table_number}')">✏️ Editar</button><button class="btn btn-red btn-sm" onclick="delMesa('${t.id}')">🗑️ Excluir</button></div>`;
  c.appendChild(d);
  try{new QRCode($('qr_'+t.id),{text:u,width:150,height:150})}catch(e){console.warn('Erro ao gerar QR:',e)}
 });
}
async function editMesa(id,atual){
 const novo=prompt('Novo número da mesa:',atual);
 if(!novo||!novo.trim())return;
 const{data}=await rpc('dono_atualizar_mesa',{p_store_id:S.store.id,p_table_id:id,p_numero:novo.trim()});
 if(data?.ok){toast('Mesa atualizada! ✅');await reloadMesas()}
 else toast(data?.error||'Erro ao atualizar','err');
}
async function delMesa(id){
 if(!confirm('Excluir esta mesa e o QR Code?'))return;
 const{data}=await rpc('dono_excluir_mesa',{p_store_id:S.store.id,p_table_id:id});
 if(data?.ok){toast('Mesa excluída! 🗑️');await reloadMesas()}
 else toast(data?.error||'Erro ao excluir','err');
}

// ---------- BOOT ----------
async function boot(){try{await waitSB()}catch(e){return}const{data}=await supabase.auth.getSession();if(data.session)await enterApp();else show('login')}
boot();
window.switchEntry=switchEntry;window.createStore=createStore;window.ownerLogin=ownerLogin;window.logout=logout;window.refreshAll=refreshAll;window.openTab=openTab;window.ackAlert=ackAlert;window.doneAlert=doneAlert;window.createMesa=createMesa;window.forceRenderMesas=forceRenderMesas;window.editMesa=editMesa;window.delMesa=delMesa;
</script>
</body>
</html>
