<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Anote — Garçom</title>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";
window.supabase=createClient("https://mrchckrrkkvkmhpgellp.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yY2hja3Jya2t2a21ocGdlbGxwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1NDU4NTYsImV4cCI6MjA4OTEyMTg1Nn0.sIhnEkNV7614lZj3WKFFjSvyxLqVf0ReNu-ka88eUjk");
window.dispatchEvent(new Event("supabase-ready"));
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f172a;--card:#1e293b;--card2:#0b1220;--border:#2c3a52;--txt:#f1f5f9;--mut:#94a3b8;--green:#22c55e;--blue:#3b82f6;--red:#ef4444;--radius:14px}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt)}
.wrap{max-width:560px;margin:0 auto;padding:16px}.hidden{display:none!important}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
h2{font-size:17px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 16px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
.btn-green{background:var(--green);color:#052e16}.btn-blue{background:var(--blue);color:#fff}.btn-red{background:var(--red);color:#fff}.btn-block{width:100%}
input,select,textarea{width:100%;padding:11px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--txt);font-size:14px;margin-bottom:10px;outline:none}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px;font-weight:600}
.muted{color:var(--mut);font-size:13px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.title{font-size:22px;font-weight:800}
.order-card{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
.order-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.b-new{background:#dbeafe;color:#1d4ed8}.b-preparing{background:#fef3c7;color:#b45309}.b-ready{background:#dcfce7;color:#15803d}
.msg{padding:11px;border-radius:10px;font-size:14px;margin-bottom:8px}
.msg.err{background:#451a1a;color:#fca5a5;border:1px solid #7f1d1d}
.login-shell{max-width:400px;margin:60px auto 0}
</style>
</head>
<body>
<div class="wrap">
<div id="screen_login"><div class="login-shell"><div class="card">
<div class="title" style="text-align:center;margin-bottom:8px">🤵 Garçom</div>
<label>Código da loja</label><input id="st_code" style="text-transform:uppercase"/>
<button class="btn btn-green btn-block" onclick="login()">Entrar</button>
<div id="res"></div></div></div></div>
<div id="screen_app" class="hidden">
<div class="topbar"><div><div class="title" id="store_name">Loja</div><div class="muted">🤵 Garçom</div></div><button class="btn btn-red" onclick="logout()">Sair</button></div>
<div id="alerts"></div>
<div class="card"><h2>📦 Pedidos pra entregar</h2><div id="list"></div></div>
<div class="card"><h2>➕ Pedido rápido</h2>
<label>Mesa</label><select id="g_mesa"></select>
<label>Produto</label><select id="g_prod"></select>
<label>Qtd</label><input id="g_qtd" type="number" min="1" value="1"/>
<label>Obs</label><textarea id="g_obs"></textarea>
<button class="btn btn-green btn-block" onclick="send()">Enviar pra cozinha</button>
<div id="gres"></div></div>
</div>
</div>
<script>
let store=null,code=null,D={tables:[],products:[],orders:[]},last=0,timer=null;
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const STATUS={new:'Novo',preparing:'Preparando',ready:'Pronto'};
function waitForSupabase(){return new Promise((res,rej)=>{if(window.supabase)return res();const t=setTimeout(()=>rej(),10000);window.addEventListener('supabase-ready',()=>{clearTimeout(t);res()},{once:true})})}
async function login(){code=document.getElementById('st_code').value.trim().toUpperCase();const b=document.getElementById('res');b.innerHTML='<div class="msg err" style="background:#14351f;color:#86efac">Verificando...</div>';const{data}=await supabase.rpc('staff_entrar',{p_codigo:code});if(!data||!data.ok){b.innerHTML=`<div class="msg err">${data?.error||'Erro'}</div>`;return}store=data.store;enter()}
function logout(){clearInterval(timer);store=null;document.getElementById('screen_app').classList.add('hidden');document.getElementById('screen_login').classList.remove('hidden')}
async function enter(){document.getElementById('screen_login').classList.add('hidden');document.getElementById('screen_app').classList.remove('hidden');document.getElementById('store_name').textContent=store.name;await refresh();timer=setInterval(refresh,5000)}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.1;o.start();setTimeout(()=>{o.stop();c.close()},300)}catch(e){}}
async function refresh(){if(!store||!code)return;const[a,b]=await Promise.all([supabase.rpc('staff_alertas',{p_store_id:store.id,p_codigo:code}),supabase.rpc('staff_carregar',{p_store_id:store.id,p_codigo:code})]);if(b.data&&b.ok){D=b.data;renderLists()}if(a.data&&a.ok){const al=(a.data.alerts||[]).filter(x=>x.type==='waiter');if(al.length>last)beep();last=al.length;renderAlerts(al)}}
function renderAlerts(al){document.getElementById('alerts').innerHTML=al.map(x=>`<div class="msg err">🔔 <b>Mesa ${x.table_number}</b> chamando! <button class="btn btn-green" style="padding:6px 10px" onclick="attend('${x.id}')">✅ Atender</button></div>`).join('')}
async function attend(id){await supabase.rpc('staff_alerta_ack',{p_store_id:store.id,p_codigo:code,p_alert_id:id});refresh()}
function renderLists(){document.getElementById('g_mesa').innerHTML=D.tables.map(t=>`<option value="${t.id}">Mesa ${t.table_number}</option>`).join('')||'<option value="">Sem mesas</option>';document.getElementById('g_prod').innerHTML=D.products.map(p=>`<option value="${p.id}">${p.name} — ${money(p.price)}</option>`).join('');const a=D.orders.filter(o=>['new','preparing','ready'].includes(o.status));document.getElementById('list').innerHTML=a.length?a.map(o=>`<div class="order-card"><div class="order-head"><b>#${o.order_number}</b><span class="badge b-${o.status}">${STATUS[o.status]||o.status}</span></div><div class="muted">${o.table_number?'Mesa '+o.table_number:o.order_type} • ${money(o.total)}</div><div style="margin:6px 0">${(o.items||[]).map(i=>`${i.qty}x ${i.name}`).join('<br>')||''}</div><button class="btn btn-blue" onclick="deliver('${o.id}')">✅ Entregue</button></div>`).join(''):'<div class="muted">Nenhum pedido ativo.</div>'}
async function deliver(id){await supabase.rpc('staff_atualizar_pedido',{p_store_id:store.id,p_codigo:code,p_order_id:id,p_status:'delivered',p_payment:null});refresh()}
async function send(){const m=document.getElementById('g_mesa').value,p=document.getElementById('g_prod').value,q=Number(document.getElementById('g_qtd').value||1),o=document.getElementById('g_obs').value.trim()||null,b=document.getElementById('gres');if(!m||!p){b.innerHTML='<div class="msg err">Escolha mesa e produto.</div>';return}const{data}=await supabase.rpc('staff_criar_pedido',{p_store_id:store.id,p_codigo:code,p_customer_id:null,p_table_id:m,p_order_type:'table',p_order_source:'waiter',p_notes:null,p_items:[{product_id:p,quantity:q,notes:o}]});b.innerHTML=data?.ok?`<div class="msg err" style="background:#14351f;color:#86efac">Pedido #${data.order_number} enviado! 🔥</div>`:`<div class="msg err">${data?.error}</div>`;refresh()}
async function boot(){try{await waitForSupabase()}catch(e){return}
const _p=new URLSearchParams(location.search);const _c=_p.get('codigo');if(_c)document.getElementById('st_code').value=_c;}
boot();
window.login=login;window.logout=logout;window.attend=attend;window.deliver=deliver;window.send=send;
</script>
</body>
</html>
